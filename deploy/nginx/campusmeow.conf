# Host Nginx: install in sites-available and link from sites-enabled.
# Bootstrap HTTP first; Certbot adds HTTPS to the installed copy.
server {
    listen 80;
    server_name www.afnshi.cn;

    root /var/www/campusmeow;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No URI suffix: preserve the complete /api/... request path.
        proxy_pass http://127.0.0.1:18045;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
