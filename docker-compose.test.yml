name: campus-meow-test

services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_meow_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: test_root_password
    ports: ["127.0.0.1:13306:3306"]
    tmpfs: [/var/lib/mysql]
    networks: [test-backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest_root_password"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  mongo-test:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: campus_meow_test
      MONGO_INITDB_ROOT_USERNAME: test_user
      MONGO_INITDB_ROOT_PASSWORD: test_password
    ports: ["127.0.0.1:27018:27017"]
    tmpfs: [/data/db]
    networks: [test-backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m

networks:
  test-backend: