services:
  mysql:
    image: mysql:8.4
    command:
      - --innodb-buffer-pool-size=96M
      - --max-connections=30
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:13345:3306"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 256m
    cpus: 0.35
    restart: unless-stopped
    logging: &limited-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:8
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "0.256"
      - --setParameter
      - diagnosticDataCollectionEnabled=false
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27045:27017"
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s
    mem_limit: 448m
    cpus: 0.35
    restart: unless-stopped
    logging: *limited-logging

  api:
    build:
      context: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=62 -XX:InitialRAMPercentage=15
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MONGO_HOST: mongodb
      MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL: ${JWT_TTL:-3600}
    depends_on:
      mysql: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    ports:
      - "127.0.0.1:18045:8080"
    networks:
      internal: {}
      edge:
        aliases: [zyf2045-backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 320m
    cpus: 0.45
    restart: unless-stopped
    logging: *limited-logging

networks:
  internal:
    name: zyf2045-internal
    internal: true
  edge:
    name: zyf2045-edge
    external: true

volumes:
  mysql-data:
  mongo-data:
